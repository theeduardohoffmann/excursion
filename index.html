<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excursion</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 0 0;
      background-color: black;
      text-align: center;
      font-family: Verdana, Geneva, sans-serif;
      color: white;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 50px;
      font-weight: normal;
      color: white;
      text-align: center;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 42px;
      font-weight: 300;
      color: white;
    }

    p {
      margin: 0 0 20px;
      font-size: 21px;
      color: gray;
    }

    a.download {
      display: inline-block;
      font-size: 16px;
      color: aquamarine;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .phone {
      display: block;
      margin: 30px auto 50px;
      width: 330px;
    }

    .feature-photo {
      display: block;
      margin: 0 auto 20px;
      width: 896px;
    }

    .phone-icon {
      display: block;
      margin: 0 auto 20px;
      width: 64px;
    }

    .coming-soon {
      margin-bottom: 40px;
    }

    footer {
      padding: 20px;
      text-align: right;
      font-size: 20px;
      color: gray;
    }

    @media (max-width: 700px) {
      h1 { font-size: 32px; }
      h2 { font-size: 28px; }
      p { font-size: 16px; padding: 0 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Discover hidden places in the world around you</h1>
    <a class="download" href="#">Download Excursion (Coming soon!)</a>
  </header>

  <main>
    <!-- Phone mockup with the waterfall video playing inside the screen -->
    <img class="phone" src="img/phone-waterfall.png" alt="Excursion app on an iPhone">

    <h2>Your personal travel guide</h2>
    <p>Excursion remembers places you like, and recommends new points of interest around you.</p>

    <img class="feature-photo" src="img/tents.jpg" alt="Lit tents on a mountain at night">

    <img class="phone-icon" src="img/phone-icon.png" alt="">
    <h2 class="coming-soon">Coming Soon for iPhone and Android</h2>
    <a class="download" href="#">Download Excursion (Coming soon!)</a>
  </main>

  <footer>&copy; Excursion</footer>
</body>
</html>
